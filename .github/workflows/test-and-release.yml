name: Test and Release

# Tag pushes are validated too. Publishing remains a separate explicit action.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: ioBroker/testing-action-check@v1
        with:
          node-version: '24'
          lint: true
      - run: npm run check:admin
      - run: npm run test:metadata

  adapter-tests:
    needs: check-and-lint
    name: Node.js ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
        os: [ubuntu-latest]
    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}
      - name: Fetch historical comparison bases
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --unshallow --tags
          fi
      - run: npm run test:artifact
      - run: npm run test:equivalence
